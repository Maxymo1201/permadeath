# Permadeath access transformers (validated at build time by ModDevGradle: validateAccessTransformers = true).
# Each entry replaces a Fabric accessor/mixin of the original mod.

# MobCapMixin: D10+ doubled hostile mob cap (MobCapController).
public-f net.minecraft.world.entity.MobCategory max
# QuantumCreeperMixin: radius 20 and 15 tick fuse (GameplayRules#quantumCreeper).
public net.minecraft.world.entity.monster.Creeper maxSwell
public net.minecraft.world.entity.monster.Creeper explosionRadius
# GuardianAttackGoalMixin: D40+ laser charges twice as fast (GameplayRules#guardianBeam).
public net.minecraft.world.entity.monster.Guardian$GuardianAttackGoal
public net.minecraft.world.entity.monster.Guardian$GuardianAttackGoal attackTime
# BeeEntityMixin: D20+ bees keep their stinger (GameplayRules#beeStinger).
public net.minecraft.world.entity.animal.Bee setHasStung(Z)V
# LargeFireballMinix: explosion power of the custom ghasts (GameplayRules#ghastFireballPower).
public net.minecraft.world.entity.projectile.LargeFireball explosionPower
