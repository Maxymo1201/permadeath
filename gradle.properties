neo_version_range=[21.1.0,)
loader_version_range=[4,)
moddevgradle_version=2.0.148

## Mod
mod_id=permadeath
mod_name=Permadeath
mod_license=CC0-1.0
mod_version=2.0.0
mod_group_id=com.serthekiller.permadeath
mod_authors=Serthekiller (Fabric original), NeoForge port contributors
mod_description=Permadeath (serie de ElRichMC) para NeoForge 1.21.1. Días 0-60, D60 es el final.

